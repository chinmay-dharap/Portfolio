<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Notes on cybersecurity, projects, and learning by Chinmay Dharap.">
    <title>Blog | Chinmay Dharap</title>
    <link rel="icon" href="../photos/fav/favicon.ico">
    <link rel="stylesheet" href="blog.css">
  </head>
  <body>
    <header class="site-header">
      <a class="back-link" href="../index.html">Back to Portfolio</a>
      <h1>Bits & Beliefs Blog</h1>
      <p class="intro">Notes on security, projects, and the lessons I pick up along the way.</p>
    </header>
    <main>
      <section class="post-list" id="post-list" aria-label="Blog posts"></section>
    </main>
    <footer class="site-footer"><p>© <span id="year"></span> Chinmay Dharap</p></footer>
    <script src="posts.js"></script>
    <script>
      const list = document.getElementById('post-list');
      const posts = [...window.BLOG_POSTS].sort((a, b) => new Date(b.date) - new Date(a.date));
      const prettyDate = date => new Intl.DateTimeFormat('en', { dateStyle: 'long' }).format(new Date(`${date}T00:00:00`));
      list.innerHTML = posts.length ? posts.map(post => `
        <a class="post-card" href="post.html?post=${encodeURIComponent(post.slug)}">
          <time class="post-date" datetime="${post.date}">${prettyDate(post.date)}</time>
          <h2>${post.title}</h2>
          <p>${post.excerpt}</p>
          <div class="tag-list">${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
        </a>`).join('') : '<p class="empty-state">No posts yet. Please check back soon.</p>';
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
